<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
>
  <!-- Definiciones opcionales -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="#590dd4" />
      <stop offset="100%" stop-color="#410e58" />
    </linearGradient>
  </defs>

  <!-- Rectángulo-->
  <path
    d="
      M 30 70
      L 30 50
      C 30 50 30 30 50 30
      L 70 30

      M 130 30
      L 150 30
      C 150 30 170 30 170 50
      L 170 70

      M 170 130
      L 170 150
      C 170 150 170 170 150 170
      L 130 170

      M 70 170
      L 50 170
      C 50 170 30 170 30 150
      L 30 130
    "
    fill="none"
    stroke="url(#gradient)"
    stroke-width="17"
  />

  <circle
    cx="100"
    cy="100"
    r="40"
    fill="none"
    stroke="url(#gradient)"
    stroke-width="17"
  />
</svg>